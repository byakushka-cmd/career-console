[project]
name = "career-console"
version = "0.1.0"
description = "Local-first personal job-search workspace (single user, SQLite)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.13.1",
]

[project.scripts]
career-console = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: needs the private snapshot in data/source (skipped when absent)",
]
