<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07080A" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{% endblock %} · Career Console</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ asset('app.css') }}">
<script src="{{ asset('theme.js') }}"></script>
<script src="{{ asset('forms.js') }}" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/pipeline"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Career Console</a>
    <nav class="nav-top" aria-label="Main">
      {%- for key, label, href in nav %}
      <a href="{{ href }}"{% if active == key %} aria-current="page"{% endif %}>{{ label }}</a>
      {%- endfor %}
    </nav>
    <span class="mode mono up" title="Runs on this computer only; nothing is sent anywhere">Local</span>
    {%- set mine = my_links() %}
    {%- if mine.linkedin %}
    <button class="copy-link{{ ' first' }}" type="button" data-copy="{{ mine.linkedin }}" title="Copy your LinkedIn profile link: {{ mine.linkedin }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>LinkedIn</span></button>
    {%- endif %}
    {%- if mine.other %}
    <button class="copy-link" type="button" data-copy="{{ mine.other }}" title="Copy your link: {{ mine.other }}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>CV</span></button>
    {%- endif %}
    <button class="theme" id="theme-toggle" type="button" hidden>
      <svg data-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>
      <svg data-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      <span>Theme</span>
    </button>
  </div>
</header>
<main id="main" class="page">
{% block content %}{% endblock %}
</main>
<nav class="nav-bottom" aria-label="Main">
  <a href="/opportunities"{% if active == 'opportunities' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>Opportunities</a>
  <a href="/pipeline"{% if active == 'pipeline' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>Pipeline</a>
  <a href="/diagnostics"{% if active == 'diagnostics' %} aria-current="page"{% endif %}>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>Diagnostics</a>
</nav>
</body>
</html>
